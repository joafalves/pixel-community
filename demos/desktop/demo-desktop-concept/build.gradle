plugins {
    id "application"
    id "edu.sc.seis.launch4j" version "4.0.0"
}

dependencies {
    implementation project(":${rootProject.name}-desktop")
    implementation project(":${rootProject.name}-ext-ecs")
    implementation project(":${rootProject.name}-ext-ecs-extra")
    implementation project(":${rootProject.name}-math")
    implementation project(":${rootProject.name}-ext-log4j2")
}

application {
    mainClass = 'org.pixel.demo.concept.performance.PerformanceGame'
}

launch4j {
    mainClassName = 'org.pixel.demo.concept.performance.PerformanceGame'
    // icon = "${projectDir}/icons/myApp.ico"
}

// Space Shooter (org.pixel.demo.concept.spaceshooter). Options (play-testing): -Dspaceshooter.autoplay=true,
// -Dspaceshooter.wave=5, -Dspaceshooter.capture=<dir> -Dspaceshooter.captureAt=2,8 (screenshots, then exit).
tasks.register('runSpaceShooter', JavaExec) {
    group = 'application'
    description = 'Runs the Space Shooter demo game.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.pixel.demo.concept.spaceshooter.SpaceShooterGame'
    workingDir = projectDir
    systemProperties System.properties.findAll { it.key.toString().startsWith('spaceshooter.') }
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
    if (JavaVersion.current() >= JavaVersion.VERSION_22) {
        jvmArgs '--enable-native-access=ALL-UNNAMED' // LWJGL uses native access (JDK 22+ warns otherwise)
    }
}
