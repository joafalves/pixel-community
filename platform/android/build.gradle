// Only part of the build when pixel.android is enabled (see settings.gradle).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${androidGradlePluginVersion}"
    }
}

apply plugin: 'com.android.library'

android {
    namespace "org.pixel.platform.android"
    compileSdk Integer.parseInt(androidCompileSdk)

    defaultConfig {
        minSdk Integer.parseInt(androidMinSdk)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(":${rootProject.name}-commons")
    api project(":${rootProject.name}-content")
    api project(":${rootProject.name}-graphics")
    api project(":${rootProject.name}-core")
    api project(":${rootProject.name}-opengl")
}
