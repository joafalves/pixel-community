buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Only resolved when the Android build is enabled in settings.gradle.
        // NOTE: Gradle 9 requires a recent AGP; bump this when re-enabling Android.
        classpath 'com.android.tools.build:gradle:8.9.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "org.pixel.android"

    defaultConfig {
        compileSdk 34
        minSdk 30

        versionCode 1
        versionName rootProject.version

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api project(":${rootProject.name}-commons")
    api project(":${rootProject.name}-content")
    api project(":${rootProject.name}-graphics")
    api project(":${rootProject.name}-core")
}

