// main project settings:
rootProject.name = "pixel"

// Android (optional, off by default): set pixel.android=true to build the Android platform and demos.
// Checked in order: -Ppixel.android=true (command line or gradle.properties), pixel.android=true in local.properties
// (per developer, not committed), the PIXEL_ANDROID environment variable. The SDK comes from sdk.dir in
// local.properties (Android Studio writes it) or ANDROID_HOME.
def localProperties = new Properties()
def localPropertiesFile = new File(rootDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def androidSetting = providers.gradleProperty("pixel.android").getOrNull()
        ?: localProperties.getProperty("pixel.android")
        ?: System.getenv("PIXEL_ANDROID")
def enableAndroidBuild = androidSetting?.trim()?.toBoolean() ?: false
def androidSdk = localProperties.getProperty("sdk.dir") ?: System.getenv("ANDROID_HOME")

if (enableAndroidBuild) {
    if (androidSdk == null || !new File(androidSdk).isDirectory()) {
        throw new GradleException("pixel.android is enabled but no Android SDK was found: set sdk.dir in "
                + "local.properties or ANDROID_HOME (found: " + androidSdk + ").")
    }
    println("Android build: enabled (SDK: " + androidSdk + ")")
} else {
    println("Android build: disabled (enable with -Ppixel.android=true or pixel.android=true in local.properties)")
}

// modules:
include "modules/commons",
        "modules/math",
        "modules/graphics",
        "modules/content",
        "modules/core",
        "modules/pipeline"

// platform modules:
include "platform/opengl"
include "platform/desktop"
if (enableAndroidBuild) {
    include "platform/android"
}

// extensions:
include "extensions/ext-log4j2",
        "extensions/ext-ecs",
        "extensions/ext-ecs-extra",
        "extensions/ext-tween",
        "extensions/ext-decs",
        "extensions/ext-network"

// tools:
include "tools/arkade"

// demos:
if (System.properties["PIXEL_RELEASE"] == null) {
    // desktop:
    include "demos/desktop/demo-desktop-learning",
            "demos/desktop/demo-desktop-concept",
            "demos/desktop/demo-desktop-imgui"

    // android:
    if (enableAndroidBuild) {
        include "demos/android/demo-android-learning"
    }
}

// bootstrap module names:
rootProject.children.each(({
    def parts = it.name.split("/")
    def prefix = rootProject.name + "-"
    it.name = prefix + parts.last()
} as Closure))
