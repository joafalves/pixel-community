import org.jetbrains.gradle.ext.*

// Pixel Version:
group = "io.github.joafalves"
version = System.properties["PIXEL_RELEASE"] ?: "DEV-${gitCommitHash()}"

ext {
    dependencyMap = [
            lwjgl  : "3.3.6",
            lombok : "1.18.42",
            junit  : "5.14.0",
            mockito: "5.20.0"
    ]
}

println("Java Version: ${JavaVersion.current()}")
println("Project Group: ${group}")
println("Project Version: ${version}")

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Android Gradle Plugin / Kotlin are declared in the Android modules themselves (only built when enabled).
        classpath "org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin:1.4.1"
    }
}

apply plugin: "idea"
apply plugin: "org.jetbrains.gradle.plugin.idea-ext"

idea {
    project {
        settings {
            runConfigurations {
                defaults(Application) {
                    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                        jvmArgs = "-XstartOnFirstThread"
                    }
                }
            }
        }
    }
}

allprojects {
    version = rootProject.version
    ext {
        namespace = "org.pixel"
    }
    repositories {
        mavenCentral()
        google()
        // opt-in only, so stale local artifacts never shadow real ones: ./gradlew build -PuseMavenLocal
        if (rootProject.hasProperty("useMavenLocal")) {
            mavenLocal()
        }
    }
}

subprojects { project ->
    apply plugin: "maven-publish"
    apply plugin: "signing"

    publishing {
        repositories {
            maven {
                url = project.version.endsWith('SNAPSHOT') ?
                        "https://s01.oss.sonatype.org/content/repositories/snapshots/" :
                        "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                credentials {
                    username = findProperty("sonatypeUsername") ?: System.getenv("SONATYPE_USERNAME")
                    password = findProperty("sonatypePassword") ?: System.getenv("SONATYPE_PASSWORD")
                }
            }
        }
    }

    tasks.withType(Javadoc).tap {
        configureEach {
            failOnError = false
            options.addStringOption("Xdoclint:none", "-quiet")
            options.addStringOption("encoding", "UTF-8")
            options.addStringOption("charSet", "UTF-8")
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    project.plugins.withType(JavaPlugin).whenPluginAdded {
        dependencies {
            // lombok
            compileOnly "org.projectlombok:lombok:${rootProject.ext.dependencyMap["lombok"]}"
            annotationProcessor "org.projectlombok:lombok:${rootProject.ext.dependencyMap["lombok"]}"

            // test
            testImplementation platform("org.junit:junit-bom:${rootProject.ext.dependencyMap["junit"]}")
            testImplementation "org.junit.jupiter:junit-jupiter"
            testImplementation "org.mockito:mockito-core:${rootProject.ext.dependencyMap["mockito"]}"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        }

        // Compile against the Java 17 API/bytecode regardless of which (newer) JDK runs the build.
        tasks.withType(JavaCompile).configureEach {
            options.release = 17
        }

        test {
            useJUnitPlatform()
        }

        jar {
            manifest {
                attributes(
                        "Implementation-Title": jar.getArchiveBaseName(),
                        "Implementation-Version": getArchiveVersion()
                )
            }
        }

        tasks.register('sourceJar', Jar) {
            archiveClassifier.set('sources')
            from sourceSets.main.allJava
        }

        tasks.register('javadocJar', Jar) {
            dependsOn javadoc
            archiveClassifier.set('javadoc')
            from javadoc.destinationDir
        }

        tasks.withType(AbstractPublishToMaven).configureEach {
            // only publish modules with "mavenPublish" set to "true"
            it.enabled = (project.ext.has("mavenPublish") && project.ext.get("mavenPublish"))
        }

        tasks.named("assemble") {
            dependsOn sourceJar, javadocJar
        }

        signing {
            if (rootProject.hasProperty("signing.keyId")) {
                sign(publishing.publications) // sign everything to be published
            }
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    artifact(sourceJar) {
                        classifier = "sources"
                    }

                    artifact(javadocJar) {
                        classifier = "javadoc"
                    }

                    groupId = rootProject.group
                    artifactId = project.name
                    version = rootProject.version

                    pom {
                        name = "Pixel 2D Game Framework"
                        description = "Modular Java/Kotlin 2D Game Framework."
                        url = "https://github.com/joafalves/pixel-community"
                        licenses {
                            license {
                                name = "The Apache License, Version 2.0"
                                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                            }
                        }
                        developers {
                            developer {
                                id = "jfalves"
                                name = "João Alves"
                                email = "joao.cpp.sca@gmail.com"
                            }
                        }
                        scm {
                            connection = "scm:git:git://github.com/joafalves/pixel-community.git"
                            developerConnection = "scm:git:ssh://github.com/joafalves/pixel-community.git"
                            url = "https://github.com/joafalves/pixel-community"
                        }
                    }
                }
            }
            repositories {
                if (rootProject.hasProperty("sonatypeUsername") && rootProject.hasProperty("sonatypePassword")) {
                    maven {
                        url "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2"
                        credentials {
                            username sonatypeUsername
                            password sonatypePassword
                        }
                    }
                }
            }
        }
    }

    // Add -XstartOnFirstThread to any subproject that uses the 'application' plugin on macOS.
    // This is required by LWJGL on macOS to run on the main thread.
    project.plugins.withId("application") {
        project.afterEvaluate {
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                application {
                    def current = applicationDefaultJvmArgs ?: []
                    if (!current.contains("-XstartOnFirstThread")) {
                        applicationDefaultJvmArgs = current + "-XstartOnFirstThread"
                    }
                }
            }
        }
    }
}

def gitCommitHash() {
    try {
        return providers.exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim() ?: "unknown"
    } catch (Exception ignored) {
        return "unknown" // e.g. building from a source archive without git
    }
}